# Profile prod: tudo via variáveis de ambiente, sem defaults (falha rápida se ausente).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  flyway:
    # Em prod as migrations são aplicadas pela pipeline (./mvnw flyway:migrate), não no startup.
    enabled: false

logging:
  structured:
    format:
      console: io.gnomon.shared.logging.GnomonStructuredLogFormatter

gnomon:
  security:
    require-verified-email: ${REQUIRE_VERIFIED_EMAIL:true}
