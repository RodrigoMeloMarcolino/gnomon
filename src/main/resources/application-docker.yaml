# Profile docker: os tokens mantêm o issuer público, mas a API busca as chaves pela rede interna.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:gnomon}
    username: ${DB_USER:gnomon}
    password: ${DB_PASSWORD:gnomon}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://keycloak:8081/realms/gnomon/protocol/openid-connect/certs}
