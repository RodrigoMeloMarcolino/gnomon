spring:
  application:
    name: gnomon-api
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      # O schema é de propriedade do Flyway; o Hibernate apenas valida.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
