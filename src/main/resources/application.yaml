spring:
  application:
    name: gnomon-api
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      # O schema é de propriedade do Flyway; o Hibernate apenas valida.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/gnomon}
          audiences: gnomon-api

gnomon:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

server:
  port: ${SERVER_PORT:8080}
