spring:
  application:
    name: gnomon-api
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      # O schema é de propriedade do Flyway; o Hibernate apenas valida.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      timeout: ${REDIS_TIMEOUT:1s}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/gnomon}
          audiences: gnomon-api

gnomon:
  booking:
    default-phone-region: ${DEFAULT_PHONE_REGION:BR}
  cache:
    enabled: ${CACHE_ENABLED:true}
    catalog:
      ttl: ${CATALOG_CACHE_TTL:10m}
    availability:
      ttl: ${AVAILABILITY_CACHE_TTL:60s}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    require-verified-email: ${REQUIRE_VERIFIED_EMAIL:false}

server:
  port: ${SERVER_PORT:8080}
