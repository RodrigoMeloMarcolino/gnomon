spring:
  application:
    name: gnomon-api
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      # O schema é de propriedade do Flyway; o Hibernate apenas valida.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      timeout: ${REDIS_TIMEOUT:1s}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/gnomon}
          audiences: gnomon-api

logging:
  level:
    root: ${LOG_LEVEL:INFO}

otel:
  service:
    name: ${OTEL_SERVICE_NAME:gnomon}
  traces:
    exporter: none
  metrics:
    exporter: none
  logs:
    exporter: ${OTEL_LOGS_EXPORTER:none}
  instrumentation:
    common:
      default-enabled: false
    logback-appender:
      enabled: true
  blrp:
    max:
      queue:
        size: ${OTEL_BLRP_MAX_QUEUE_SIZE:2048}
      export:
        batch:
          size: ${OTEL_BLRP_MAX_EXPORT_BATCH_SIZE:512}
  exporter:
    otlp:
      timeout: ${OTEL_EXPORTER_OTLP_LOGS_TIMEOUT:5s}
      logs:
        protocol: ${OTEL_EXPORTER_OTLP_LOGS_PROTOCOL:http/protobuf}

gnomon:
  booking:
    default-phone-region: ${DEFAULT_PHONE_REGION:BR}
    max-advance-days: ${BOOKING_MAX_ADVANCE_DAYS:180}
    slot-retention:
      enabled: ${BOOKING_SLOT_RETENTION_ENABLED:true}
      retention: ${BOOKING_SLOT_RETENTION:30d}
      cleanup-interval: ${BOOKING_SLOT_RETENTION_CLEANUP_INTERVAL:1h}
      batch-size: ${BOOKING_SLOT_RETENTION_BATCH_SIZE:10000}
      max-batches-per-run: ${BOOKING_SLOT_RETENTION_MAX_BATCHES_PER_RUN:100}
  cache:
    enabled: ${CACHE_ENABLED:true}
    catalog:
      ttl: ${CATALOG_CACHE_TTL:10m}
    availability:
      ttl: ${AVAILABILITY_CACHE_TTL:60s}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    require-verified-email: ${REQUIRE_VERIFIED_EMAIL:false}

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    accesslog:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: false
